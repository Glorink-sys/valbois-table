<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Voyageurs de Valbois</title>
<style>
:root{
  --bg:#efe4c6;
  --bg-alt:#e6d7ae;
  --surface:#f8f1dd;
  --surface-2:#ecddb2;
  --ink:#241d12;
  --ink-soft:#5c4e2f;
  --line:#b6944f;
  --line-soft:#d3bb80;
  --gold:#93630f;
  --gold-strong:#6f4a0c;
  --arcane:#2c5a4e;
  --arcane-strong:#1f4137;
  --wax:#7b241f;
  --wax-strong:#591a16;
  --shadow:rgba(36,29,18,.22);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17130c;
    --bg-alt:#1d170e;
    --surface:#221b10;
    --surface-2:#2b2213;
    --ink:#ecdfc0;
    --ink-soft:#c2ac7c;
    --line:#5f4c28;
    --line-soft:#4a3b21;
    --gold:#d9a53f;
    --gold-strong:#f0c568;
    --arcane:#72ab9c;
    --arcane-strong:#93c7b7;
    --wax:#c25850;
    --wax-strong:#db766e;
    --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17130c;
  --bg-alt:#1d170e;
  --surface:#221b10;
  --surface-2:#2b2213;
  --ink:#ecdfc0;
  --ink-soft:#c2ac7c;
  --line:#5f4c28;
  --line-soft:#4a3b21;
  --gold:#d9a53f;
  --gold-strong:#f0c568;
  --arcane:#72ab9c;
  --arcane-strong:#93c7b7;
  --wax:#c25850;
  --wax-strong:#db766e;
  --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Crimson Pro',Georgia,'Iowan Old Style',serif;
  font-size:16px;
  line-height:1.5;
  padding-inline:16px;
  padding-block:28px 60px;
}
h1,h2,h3,.font-display{
  font-family:'Cinzel',Georgia,serif;
  text-wrap:balance;
  letter-spacing:.02em;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;}
a{color:var(--arcane);}
button{font-family:inherit;}
::selection{background:var(--gold);color:var(--surface);}
:focus-visible{outline:2px solid var(--arcane);outline-offset:2px;}
.wrap{max-width:1180px;margin:0 auto;}

.masthead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.masthead .sigil{width:34px;height:34px;flex:none;color:var(--gold);}
.masthead h1{font-size:clamp(1.5rem,1.1rem + 1.6vw,2.3rem);margin:0;color:var(--ink);}
.masthead .tag{font-size:.85rem;color:var(--ink-soft);font-style:italic;}
.lede{color:var(--ink-soft);max-width:66ch;margin:0 0 22px;font-size:1.02rem;}

.info-strip{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:10px;padding:16px 18px;margin-bottom:22px;
  box-shadow:0 1px 0 var(--line-soft) inset;
}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.field label{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-strong);}
input,select,textarea{
  font-family:inherit;font-size:.98rem;color:var(--ink);
  background:var(--bg-alt);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;width:100%;
}
textarea{resize:vertical;min-height:64px;line-height:1.45;}
input[type="number"]{font-family:'IBM Plex Mono',monospace;}
input[readonly]{opacity:.7;cursor:not-allowed;}

.app{display:grid;grid-template-columns:1fr;gap:22px;}
@media (min-width:960px){
  .app{grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);align-items:start;}
  .sheet{position:sticky;top:16px;}
}
.app.is-validated .actions-row.creation-actions{display:none;}
.app.is-validated #tabpanel{padding:14px 18px 16px;}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin;}
.tab-btn{
  flex:none;font-family:'Cinzel',serif;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;
  background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line-soft);
  border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;
}
.tab-btn .n{opacity:.65;margin-right:6px;}
.tab-btn.active{background:var(--arcane);color:var(--surface);border-color:var(--arcane-strong);}
.tab-btn:hover:not(.active){background:var(--bg-alt);}

.panel-card{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:22px 22px 24px;box-shadow:0 1px 0 var(--line-soft) inset;
}
.panel-card h2{font-size:1.25rem;margin:0 0 4px;color:var(--ink);}
.panel-hint{color:var(--ink-soft);font-size:.92rem;margin:0 0 18px;}

.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:6px;}
.opt-card{
  text-align:left;background:var(--bg-alt);border:1.5px solid var(--line-soft);border-radius:9px;
  padding:11px 13px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;
}
.opt-card:hover{border-color:var(--gold);}
.opt-card.active{border-color:var(--arcane);background:var(--surface-2);box-shadow:0 0 0 1px var(--arcane) inset;}
.opt-card .name{font-family:'Cinzel',serif;font-size:.92rem;color:var(--ink);display:block;}
.opt-card .meta{font-size:.78rem;color:var(--ink-soft);}
.opt-card .badge{position:absolute;top:8px;right:8px;font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:999px;background:var(--wax);color:#fff;}
.opt-card .badge.gros{background:var(--wax-strong);}

.detail-box{margin-top:16px;padding:14px 16px;background:var(--bg-alt);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;}
.detail-box h3{font-size:.95rem;margin:0 0 8px;}
.detail-box ul{margin:0;padding-left:20px;font-size:.92rem;color:var(--ink-soft);}
.detail-box ul li{margin-bottom:3px;}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pill{font-size:.74rem;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:999px;padding:3px 10px;color:var(--ink-soft);}

.warn-box{margin-top:12px;padding:12px 14px;background:var(--surface-2);border:1.5px solid var(--wax);border-radius:8px;font-size:.85rem;color:var(--ink);}
.warn-box strong{color:var(--wax);}
.effects-details{margin-top:8px;}
.effects-summary{
  list-style:none;cursor:pointer;user-select:none;
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;background:var(--wax);color:#fff;
  font-family:'Cinzel',serif;font-weight:700;font-size:.9rem;
}
.effects-summary::-webkit-details-marker{display:none;}
.effects-summary::marker{content:"";}
.effects-summary:hover{filter:brightness(1.1);}
.forbidden-note{font-size:.82rem;color:var(--ink-soft);margin-top:16px;padding:10px 12px;background:var(--bg-alt);border-radius:8px;border:1px dashed var(--line);}

.abil-editor{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:10px;}
.abil-edit-box{background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:9px;padding:12px;}
.abil-edit-box .lbl{font-family:'Cinzel',serif;font-size:.78rem;color:var(--gold-strong);letter-spacing:.04em;}
.abil-edit-box select{margin-top:6px;}
.pb-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.pb-row .val{font-family:'IBM Plex Mono',monospace;font-size:1.3rem;}
.pb-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-size:1rem;line-height:1;}
.pb-btn:disabled{opacity:.35;cursor:not-allowed;}
.budget-note{font-size:.85rem;color:var(--ink-soft);margin-bottom:14px;}
.race-bonus-tag{display:inline-block;margin-top:6px;font-size:.78rem;color:var(--arcane-strong);}

.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px;}
.skill-row{display:flex;flex-direction:column;gap:2px;padding:7px 4px;border-bottom:1px dashed var(--line-soft);font-size:.92rem;cursor:pointer;}
.skill-row-head{display:flex;align-items:center;gap:9px;}
.skill-row input{width:auto;flex:none;accent-color:var(--arcane);}
.skill-row.locked{opacity:.85;}
.skill-row .ab{font-size:.72rem;color:var(--ink-soft);margin-left:auto;font-family:'IBM Plex Mono',monospace;}
.skill-row-desc{font-size:.76rem;color:var(--ink-soft);margin-left:24px;}
.tag-bg{font-size:.65rem;background:var(--wax);color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;}
.tag-race{font-size:.65rem;background:var(--arcane);color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;}

.spell-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.spell-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:7px 9px;border:1px solid var(--line-soft);border-radius:6px;background:var(--bg-alt);font-size:.85rem;cursor:pointer;}
.spell-row input{accent-color:var(--arcane);flex:none;}
.spell-row-head{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;}
.spell-meta{font-size:.66rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.spell-tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.03em;background:var(--wax);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600;}
.spell-row-desc{flex-basis:100%;font-size:.78rem;color:var(--ink-soft);margin-left:24px;}
.spell-row.checked{border-color:var(--arcane);background:var(--surface-2);}

.trait-list{display:flex;flex-direction:column;gap:6px;}
.trait-card{padding:7px 9px;border:1px solid var(--line-soft);border-radius:6px;background:var(--bg-alt);font-size:.85rem;}
.trait-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.trait-usage{font-size:.66rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.trait-card-desc{font-size:.78rem;color:var(--ink-soft);margin-top:3px;}
.trait-card select,.trait-card input[type="text"]{max-width:260px;}
.trait-choice-tag{font-size:.78rem;color:var(--arcane-strong);margin-top:4px;font-weight:600;}
.trait-choice-tag em{font-weight:400;color:var(--ink-soft);}

.kit-list{list-style:none;margin:0;padding:0;}
.kit-list li{margin-bottom:6px;font-size:.92rem;}
.kit-line{position:relative;}
.kit-line summary{cursor:pointer;list-style:none;color:var(--arcane-strong);font-weight:600;text-decoration:underline;text-decoration-style:dotted;}
.kit-line summary::-webkit-details-marker{display:none;}
.kit-line summary::marker{content:"";}
.kit-line-edit{font-size:.72rem;color:var(--ink-soft);font-weight:400;text-decoration:none;margin-left:6px;}
.kit-line-options{display:none;position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:var(--surface);border:1px solid var(--gold);border-radius:8px;box-shadow:0 8px 24px var(--shadow);padding:6px;flex-direction:column;gap:3px;min-width:240px;max-width:calc(100vw - 32px);}
.kit-line[open] .kit-line-options{display:flex;}
.kit-line-opt{text-align:left;background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:6px;padding:6px 10px;font-size:.85rem;cursor:pointer;color:var(--ink);}
.kit-line-opt:hover{border-color:var(--gold);background:var(--surface-2);}
.kit-line-opt-blocked{opacity:.55;cursor:not-allowed;color:var(--wax);border-style:dashed;}
.kit-line-opt-blocked:hover{border-color:var(--line-soft);background:var(--bg-alt);}
select:disabled{opacity:.5;cursor:not-allowed;}

.kit-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px;}
.kit-cols h3{font-size:.88rem;margin:0 0 6px;color:var(--gold-strong);}
.kit-cols ul{margin:0;padding-left:18px;font-size:.9rem;color:var(--ink-soft);}

.price-wrap{overflow-x:auto;margin:8px 0 20px;border-radius:8px;}
table.price-table{border-collapse:collapse;width:100%;font-size:.8rem;min-width:460px;}
table.price-table caption{text-align:left;font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-strong);margin-bottom:6px;}
table.price-table th,table.price-table td{border:1px solid var(--line-soft);padding:5px 8px;text-align:left;}
table.price-table th{background:var(--surface-2);font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-strong);}
table.price-table td.mono{white-space:nowrap;}

.btn{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;padding:9px 16px;cursor:pointer;border:1.5px solid transparent;}
.btn-arcane{background:var(--arcane);color:var(--surface);border-color:var(--arcane-strong);}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
.btn-sm{font-size:.68rem;padding:6px 10px;}
.btn:hover{filter:brightness(1.07);}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

.sheet{
  background:var(--surface);border:1px solid var(--gold);border-radius:14px;
  padding:22px 22px 20px;box-shadow:0 8px 24px var(--shadow);position:relative;
}
.sheet::before{
  content:"";position:absolute;inset:6px;border:1px solid var(--line-soft);border-radius:9px;pointer-events:none;
}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
.sheet-head .who h2{font-size:1.4rem;margin:0 0 2px;}
.sheet-head .who .subline{font-size:.85rem;color:var(--ink-soft);}
.sheet-head .who .subline2{font-size:.78rem;color:var(--ink-soft);font-style:italic;}
.seal{width:52px;height:52px;flex:none;color:var(--wax);}

.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.stat-tile{background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:8px;padding:8px 6px;text-align:center;}
.stat-tile .v{font-family:'IBM Plex Mono',monospace;font-size:1.15rem;font-weight:600;}
.stat-tile .k{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}

.ability-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.abil-box{background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:9px;padding:9px 4px;text-align:center;}
.abil-box .name{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.05em;color:var(--gold-strong);}
.abil-box .mod{font-family:'IBM Plex Mono',monospace;font-size:1.35rem;font-weight:700;line-height:1.1;}
.abil-box .score{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-soft);}

.sheet h3.section{font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;color:var(--gold-strong);margin:16px 0 8px;border-bottom:1px solid var(--line-soft);padding-bottom:4px;}
.save-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:.85rem;}
.save-grid .row{display:flex;justify-content:space-between;padding:2px 0;}
.row.prof{color:var(--arcane-strong);font-weight:600;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--line-soft);}
.dot.on{background:var(--arcane);}

.sk-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:.82rem;}
.sk-row{display:flex;align-items:center;justify-content:space-between;padding:2px 0;border-bottom:1px dotted var(--line-soft);}
.sk-row.prof{color:var(--arcane-strong);font-weight:600;}
.sk-row .b{font-family:'IBM Plex Mono',monospace;}

.sheet-text{font-size:.86rem;color:var(--ink-soft);white-space:pre-wrap;}
.sheet ul.plain{margin:0;padding-left:18px;font-size:.85rem;color:var(--ink-soft);}

.storage-note{font-size:.74rem;color:var(--ink-soft);margin-top:16px;text-align:center;}

.play-top{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.hp-widget,.death-widget{flex:1;min-width:160px;background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:9px;padding:10px 12px;}
.hp-widget .lbl,.death-widget .lbl{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-strong);margin-bottom:6px;}
.hp-controls{display:flex;align-items:center;gap:8px;}
.hp-controls input{width:64px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:1.1rem;}
.hp-controls .sep{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:.9rem;}
.step-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-size:1.05rem;line-height:1;flex:none;}
.step-btn:hover{filter:brightness(1.08);}
.death-row{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-soft);margin-top:4px;}
.death-row .pips{display:flex;gap:4px;}
.death-desc{font-size:.72rem;color:var(--ink-soft);margin:8px 0 0;line-height:1.4;}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;flex:none;padding:0;}
.pip-success.on{background:var(--arcane);border-color:var(--arcane-strong);}
.pip-fail.on{background:var(--wax);border-color:var(--wax-strong);}
.pip-use.on{background:var(--gold);border-color:var(--gold-strong);}

.atk-block{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.atk-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:8px;padding:8px 12px;font-size:.9rem;}
.atk-row .nm{font-weight:600;}
.atk-row .props{font-size:.72rem;color:var(--ink-soft);font-weight:400;}
.atk-row .val{font-family:'IBM Plex Mono',monospace;white-space:nowrap;}

.resource-list{margin-bottom:4px;}
.resource-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:6px 2px;border-bottom:1px dashed var(--line-soft);font-size:.85rem;}
.resource-row .nm{min-width:140px;}
.resource-row .pips{display:flex;gap:4px;flex-wrap:wrap;}
.resource-row .pool-ctl{display:flex;align-items:center;gap:6px;}
.resource-row .pool-ctl input{width:56px;text-align:center;font-family:'IBM Plex Mono',monospace;}
.resource-desc{flex-basis:100%;font-size:.72rem;color:var(--ink-soft);margin-top:2px;}
.rest-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px;}

.gold-box{display:flex;align-items:center;gap:8px;}
.gold-box input{width:90px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:1.05rem;}
.gold-box .lbl-po{color:var(--ink-soft);font-size:.85rem;}

.inv-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.inv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:8px;padding:7px 10px;font-size:.85rem;}
.inv-row.inv-equipped{border-color:var(--arcane);background:var(--surface-2);}
.inv-name{flex:1;min-width:0;}
.inv-qty{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:.78rem;}
.inv-actions{display:flex;align-items:center;gap:6px;flex:none;}
.inv-blocked{font-size:.7rem;color:var(--ink-soft);font-style:italic;}
.inv-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;}
.inv-add select,.inv-add input[type="text"]{flex:1;min-width:120px;}
.inv-add input[type="number"]{flex:none;width:70px;}

.cond-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.cond-pill{font-size:.74rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line-soft);background:var(--bg-alt);color:var(--ink-soft);cursor:pointer;}
.cond-pill:hover{border-color:var(--gold);}
.cond-pill.on{background:var(--wax);border-color:var(--wax-strong);color:#fff;}
.cond-active-list{display:flex;flex-direction:column;gap:6px;}
.cond-active-row{font-size:.82rem;background:var(--bg-alt);border-left:3px solid var(--wax);border-radius:0 6px 6px 0;padding:6px 10px;color:var(--ink-soft);}
.cond-active-row strong{color:var(--ink);}

.lexicon-fab{
  position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--surface);
  border:2px solid var(--gold-strong);box-shadow:0 4px 14px var(--shadow);cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:40;padding:0;
}
.lexicon-fab:hover{filter:brightness(1.08);}
.lexicon-fab svg{width:24px;height:24px;}
.lexicon-modal{position:fixed;inset:0;z-index:50;}
.lexicon-backdrop{position:absolute;inset:0;background:rgba(20,16,9,.55);}
.lexicon-panel{
  position:relative;max-width:560px;margin:6vh auto 0;max-height:86vh;
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--gold);
  border-radius:14px;padding:20px;box-shadow:0 12px 40px var(--shadow);
}
.lexicon-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;}
.lexicon-head h2{margin:0;font-size:1.3rem;}
#lexicon-search{margin-bottom:12px;flex:none;}
.lexicon-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;}
.lex-entry{padding:8px 10px;border:1px solid var(--line-soft);border-radius:8px;background:var(--bg-alt);}
.lex-entry .term{font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold-strong);}
.lex-entry .def{font-size:.83rem;color:var(--ink-soft);margin-top:2px;}
@media (max-width:640px){
  .lexicon-panel{margin:0;max-height:100%;height:100%;border-radius:0;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));}
}

@media print{
  body *{visibility:hidden;}
  .sheet,.sheet *{visibility:visible;}
  .sheet{position:static;box-shadow:none;border-color:#333;left:0;top:0;margin:0;width:100%;}
  body{background:#fff;padding:0;}
}

function mod(score){return Math.floor((score-10)/2);}
function fmt(n){return (n>=0?"+":"")+n;}
function fmtSpeed(n){return (Number.isInteger(n)?n:String(n).replace(".",","))+" m";}
function profBonus(level){return level<=4?2:level<=8?3:level<=12?4:level<=16?5:6;}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function loadLocal(){
  try{
    const raw=localStorage.getItem("valbois-forge-char");
    if(raw){const parsed=JSON.parse(raw);return Object.assign(defaultState(),parsed);}
  }catch(e){}
  return null;
}
function saveLocal(){
  try{localStorage.setItem("valbois-forge-char",JSON.stringify(state));}catch(e){}
}

function raceBonusFor(key){
  const race=RACES[state.raceKey];
  if(!race)return 0;
  let b=(race.bonus.fixed&&race.bonus.fixed[key])||0;
  if(race.bonus.choice&&state.raceChoiceAbilities.includes(key))b+=race.bonus.choice.amount;
  return b;
}
function totalAbility(key){return (state.baseScores[key]||8)+raceBonusFor(key)+(state.asiBonuses[key]||0);}
function hasFeat(key){return Object.values(state.featsChosen||{}).some(f=>f.feat===key);}
function kiSaveDC(){return 8+profBonus(curLevel())+mod(totalAbility("SAG"));}
function chosenFeatsList(){return Object.keys(state.featsChosen||{}).map(Number).sort((a,b)=>a-b).map(lvl=>({level:lvl,pick:state.featsChosen[lvl]}));}

function ensureRaceChoice(){
  const race=RACES[state.raceKey];
  if(race.bonus.choice){
    const excl=race.bonus.choice.exclude||[];
    let picks=state.raceChoiceAbilities.filter(a=>ABILS.includes(a)&&!excl.includes(a));
    const need=race.bonus.choice.count;
    while(picks.length<need){
      const cand=ABILS.find(a=>!excl.includes(a)&&!picks.includes(a));
      if(!cand)break;
      picks.push(cand);
    }
    state.raceChoiceAbilities=picks.slice(0,need);
  }
  if(race.skillChoice){
    let picks=state.raceSkillChoices.filter(s=>SKILLS.some(sk=>sk.n===s));
    const need=race.skillChoice.count;
    while(picks.length<need){
      const cand=SKILLS.find(sk=>!picks.includes(sk.n));
      if(!cand)break;
      picks.push(cand.n);
    }
    state.raceSkillChoices=picks.slice(0,need);
  }else{
    state.raceSkillChoices=[];
  }
}

function currentSkillList(){
  const cls=CLASSES[state.classKey];
  if(!cls)return [];
  return cls.skills.list==="any"?SKILLS.map(s=>s.n):cls.skills.list;
}
function bgSkills(){
  const bg=BACKGROUNDS[state.bgKey];
  return bg?bg.skills:[];
}
function raceFixedSkills(){
  const r=RACES[state.raceKey];
  return r&&r.freeSkill?[r.freeSkill]:[];
}
function raceChosenSkills(){
  const r=RACES[state.raceKey];
  return r&&r.skillChoice?state.raceSkillChoices:[];
}
function isProficient(skillName){
  return state.classSkillChoices.includes(skillName)||bgSkills().includes(skillName)||raceFixedSkills().includes(skillName)||raceChosenSkills().includes(skillName);
}
function skillSource(skillName){
  if(raceFixedSkills().includes(skillName)||raceChosenSkills().includes(skillName))return "race";
  if(bgSkills().includes(skillName))return "bg";
  if(state.classSkillChoices.includes(skillName))return "classe";
  return null;
}
function skillBonus(skill){
  const m=mod(totalAbility(skill.a));
  return m+(isProficient(skill.n)?profBonus(curLevel()):0);
}

function curLevel(){
  return Math.max(1,Math.min(20,Number(state.level)||1));
}
function fightingStyle(){
  return state.classKey==="guerrier"?state.traitChoices["Style de combat"]:null;
}
function computeAC(dexMod){
  const armor=ARMOR_DATA.find(a=>a.key===state.armorKey)||ARMOR_DATA[0];
  let base;
  if(armor.none){
    base=10+dexMod;
    if(state.classKey==="barbare")base+=mod(totalAbility("CON"));
    if(state.classKey==="moine"&&!state.shield)base+=mod(totalAbility("SAG"));
  }else if(armor.dexCap===0){
    base=armor.base;
  }else if(armor.dexCap===null){
    base=armor.base+dexMod;
  }else{
    base=armor.base+Math.min(dexMod,armor.dexCap);
  }
  if(state.shield)base+=2;
  if(!armor.none&&fightingStyle()==="Défense")base+=1;
  return base;
}
function weaponAbilityMod(props){
  const strMod=mod(totalAbility("FOR"));
  const dexMod=mod(totalAbility("DEX"));
  if(/Munitions/.test(props))return dexMod;
  if(/finesse/i.test(props))return Math.max(strMod,dexMod);
  return strMod;
}
function weaponInfo(name,isOffhand){
  const w=WEAPON_DATA.find(x=>x.name===name);
  if(!w)return null;
  const aMod=weaponAbilityMod(w.props);
  const isRanged=/Munitions/.test(w.props);
  const archerie=fightingStyle()==="Archerie"&&isRanged;
  const atk=profBonus(curLevel())+aMod+(archerie?2:0);
  const twoWeapon=fightingStyle()==="Combat à deux armes";
  const isLight=lightWeaponNames().includes(name);
  const dmgMod=(isOffhand&&isLight&&!twoWeapon)?Math.min(aMod,0):aMod;
  const diceMatch=w.damage.match(/^(\d+)d(\d+)\s*(.*)$/);
  const dmgText=diceMatch?(diceMatch[1]+"d"+diceMatch[2]+fmt(dmgMod)+" "+diceMatch[3]):w.damage;
  return {name:w.name,props:w.props,atk,dmgText};
}

function computeDerived(){
  const cls=CLASSES[state.classKey]||{hitDie:8,saves:[]};
  const conMod=mod(totalAbility("CON"));
  const lvl=curLevel();
  const avgPerLevel=Math.floor(cls.hitDie/2)+1;
  const toughBonus=hasFeat("robuste")?2*lvl:0;
  const hp=cls.hitDie+conMod+(lvl-1)*(avgPerLevel+conMod)+toughBonus;
  const dexMod=mod(totalAbility("DEX"));
  const ac=computeAC(dexMod);
  const perceptionSkill=SKILLS.find(s=>s.n==="Perception");
  const passivePerception=10+skillBonus(perceptionSkill);
  return {
    level:lvl,
    pb:profBonus(lvl),
    hp:Math.max(1,hp),
    ac,
    initiative:dexMod,
    speed:(RACES[state.raceKey]||{speed:9}).speed,
    passivePerception,
    saves:cls.saves||[]
  };
}

function maxHp(){return computeDerived().hp;}
function currentHp(){
  const max=maxHp();
  if(state.hpCurrent==null)return max;
  return Math.max(0,Math.min(state.hpCurrent,max));
}
function setHpCurrent(v){
  state.hpCurrent=Math.max(0,Math.min(Math.round(v)||0,maxHp()));
}
function traitResourceInfo(t){
  if(/par tour/.test(t.usage))return null;
  if(t.name==="Imposition des mains")return {type:"pool",max:5*curLevel()};
  if(t.name==="Rage")return {type:"uses",max:curLevel()>=3?3:2};
  if(t.name==="Canalisation divine")return {type:"uses",max:curLevel()>=6?2:1};
  const m=t.usage.match(/(\d+)\s*fois/);
  if(m)return {type:"uses",max:Number(m[1])};
  if(/CHA fois/.test(t.usage))return {type:"uses",max:Math.max(1,mod(totalAbility("CHA")))};
  return null;
}
function isShortRestResource(t){return /repos court/.test(t.usage);}
function currentSubclass(){
  const traitName=SUBCLASS_TRAIT_NAME[state.classKey];
  if(!traitName)return null;
  const label=state.traitChoices[traitName];
  if(!label)return null;
  const group=SUBCLASSES[state.classKey];
  if(!group)return null;
  return Object.values(group).find(s=>s.label===label)||null;
}
function classFeaturesForLevel(){
  const cls=CLASSES[state.classKey];
  const lvl=curLevel();
  const sub=currentSubclass();
  const extra=[];
  if(sub&&sub.features[1])extra.push(...sub.features[1]);
  for(let L=2;L<=lvl;L++){
    const lf=LEVEL_FEATURES[state.classKey]&&LEVEL_FEATURES[state.classKey][L];
    if(lf&&lf.features){
      lf.features.forEach(f=>{
        if(f.placeholder&&sub)return;
        extra.push(f);
      });
    }
    if(sub&&sub.features[L])extra.push(...sub.features[L]);
  }
  chosenFeatsList().forEach(({level,pick})=>{
    if(level>lvl)return;
    const f=FEATS[pick.feat];
    if(!f)return;
    extra.push({name:"Don : "+f.name+(pick.ability?" ("+pick.ability+")":""),usage:f.usage||"Passif",effect:f.effect});
  });
  return (cls.traits||[]).concat(extra);
}
function levelFeaturesForWizard(level){
  const lf=(LEVEL_FEATURES[state.classKey]&&LEVEL_FEATURES[state.classKey][level])||{features:[],asi:false};
  const sub=currentSubclass();
  const base=(lf.features||[]).filter(f=>!(f.placeholder&&sub));
  const subFeats=(sub&&sub.features[level])||[];
  const reopened=(state.classKey==="occultiste"&&level===5)?[INVOCATIONS_OCCULTES]:[];
  return {asi:lf.asi,features:base.concat(subFeats).concat(reopened)};
}
function classResources(){
  const traits=classFeaturesForLevel();
  if(!traits.length)return [];
  return traits.map(t=>({t,info:traitResourceInfo(t)})).filter(x=>x.info);
}
function resourceUsed(name){return state.resourceUsed[name]||0;}

function seedInventory(){
  if(state.inventoryInit)return;
  const cls=CLASSES[state.classKey];
  const bg=BACKGROUNDS[state.bgKey];
  const items=[];
  let nextId=1;
  const push=(name,qty,cat,refKey)=>{items.push({id:nextId++,name,qty,cat,refKey:refKey||null});};
  const weaponQty={};
  [state.weapon1,state.weapon2,state.weaponRanged].forEach(n=>{if(n)weaponQty[n]=(weaponQty[n]||0)+1;});
  (cls.extraKit||[]).forEach(t=>{if(typeof t==="object"&&t.weapon)weaponQty[t.weapon]=(weaponQty[t.weapon]||0)+(t.qty||1);});
  Object.entries(weaponQty).forEach(([n,q])=>push(n,q,"weapon",n));
  if(state.armorKey&&state.armorKey!=="aucune")push(SHORT_ARMOR_NAME[state.armorKey]||state.armorKey,1,"armor",state.armorKey);
  if(state.shield)push("Bouclier",1,"shield","shield");
  (cls.extraKit||[]).forEach(t=>{if(typeof t!=="object")push(t,1,"other",null);});
  let gold=state.gold||0;
  (bg.equip||[]).forEach(t=>{
    const m=t.match(/^(\d+)\s*po$/);
    if(m)gold+=Number(m[1]);
    else push(t,1,"other",null);
  });
  state.inventory=items;
  state.gold=gold;
  state.inventoryInit=true;
}
function isEquippedItem(it){
  if(it.cat==="weapon")return state.weapon1===it.refKey||state.weapon2===it.refKey||state.weaponRanged===it.refKey;
  if(it.cat==="armor")return state.armorKey===it.refKey;
  if(it.cat==="shield")return !!state.shield;
  return false;
}
function effectiveWeaponChoices(){
  const cls=CLASSES[state.classKey]||{};
  const sub=currentSubclass();
  const base=cls.weaponChoices||[];
  if(sub&&sub.bonusWeapons==="martiale"){
    const martial=WEAPON_DATA.filter(w=>w.tier==="martiale").map(w=>w.name);
    return base.concat(martial.filter(n=>!base.includes(n)));
  }
  return base;
}
function effectiveArmorChoices(){
  const cls=CLASSES[state.classKey]||{};
  const sub=currentSubclass();
  const base=cls.armorChoices||[];
  const bonus=(sub&&sub.bonusArmor)||[];
  return base.concat(bonus.filter(k=>!base.includes(k)));
}
function equipBlockedReason(it){
  const cls=CLASSES[state.classKey];
  if(it.cat==="weapon"){
    if(!effectiveWeaponChoices().includes(it.refKey))return "Arme non maîtrisée par votre classe";
    return null;
  }
  if(it.cat==="armor"){
    if(!effectiveArmorChoices().includes(it.refKey))return "Armure non autorisée par votre classe";
    const a=ARMOR_DATA.find(x=>x.key===it.refKey);
    if(a&&a.req&&!reqMet(a.req))return a.req.ability+' '+a.req.score+' requise (vous avez '+totalAbility(a.req.ability)+')';
    return null;
  }
  if(it.cat==="shield"){
    if(!cls.shieldProf)return "Bouclier non maîtrisé par votre classe";
    if(isTwoHanded(state.weapon1))return "Main occupée par une arme à deux mains";
    return null;
  }
  return null;
}
function equipInventoryItem(it){
  if(it.cat==="armor"){
    state.armorKey=it.refKey;
  }else if(it.cat==="shield"){
    if(isTwoHanded(state.weapon1))return;
    state.shield=true;
  }else if(it.cat==="weapon"){
    const name=it.refKey;
    const w=WEAPON_DATA.find(x=>x.name===name);
    const ranged=w&&/Munitions/.test(w.props);
    if(ranged){
      state.weaponRanged=name;
    }else if(isTwoHanded(name)){
      state.weapon1=name;state.weapon2="";state.shield=false;
    }else if(!state.weapon1||isTwoHanded(state.weapon1)){
      state.weapon1=name;
    }else if(!state.weapon2&&!state.shield){
      state.weapon2=name;
    }else{
      state.weapon1=name;
    }
  }
  ensureEquipmentChoice();
}
function unequipInventoryItem(it){
  if(it.cat==="armor"&&state.armorKey===it.refKey)state.armorKey="aucune";
  else if(it.cat==="shield")state.shield=false;
  else if(it.cat==="weapon"){
    if(state.weapon1===it.refKey)state.weapon1="";
    else if(state.weapon2===it.refKey)state.weapon2="";
    else if(state.weaponRanged===it.refKey)state.weaponRanged="";
  }
  ensureEquipmentChoice();
}

function bindInventoryEvents(){
  const sheet=document.getElementById("sheet");

  const nameInput=sheet.querySelector("#f-inv-name");
  const weaponSel=sheet.querySelector("#f-inv-weapon");
  const armorSel=sheet.querySelector("#f-inv-armor");
  const qtyInput=sheet.querySelector("#f-inv-qty");
  function syncCatUi(){
    const cat=catSel.value;
    nameInput.style.display=cat==="other"?"":"none";
    weaponSel.style.display=cat==="weapon"?"":"none";
    armorSel.style.display=cat==="armor"?"":"none";
    qtyInput.style.display=cat==="shield"||cat==="armor"?"none":"";
  }
  syncCatUi();
  catSel.addEventListener("change",syncCatUi);
  sheet.querySelector("#btn-inv-add").addEventListener("click",()=>{
    const cat=catSel.value;
    let name,refKey,qty=Math.max(1,Number(qtyInput.value)||1);
    if(cat==="weapon"){refKey=weaponSel.value;name=refKey;}
    else if(cat==="armor"){refKey=armorSel.value;name=SHORT_ARMOR_NAME[refKey]||refKey;qty=1;}
    else if(cat==="shield"){refKey="shield";name="Bouclier";qty=1;}
    else{name=(nameInput.value||"").trim();refKey=null;if(!name)return;}

  });
  sheet.querySelectorAll("[data-inv-remove]").forEach(el=>el.addEventListener("click",()=>{
    const id=Number(el.dataset.invRemove);
    state.inventory=state.inventory.filter(it=>it.id!==id);
    renderSheet();saveLocal();
  }));
  sheet.querySelectorAll("[data-inv-equip]").forEach(el=>el.addEventListener("click",()=>{

  }));
}

function pbAdjust(ability,dir){
  const cur=state.baseScores[ability];
  const next=cur+dir;
  if(next<8||next>15)return;
  const totalCost=ABILS.reduce((s,a)=>s+PB_COST[a===ability?next:state.baseScores[a]],0);
  if(dir>0&&totalCost>27)return;
  state.baseScores[ability]=next;
  renderTab();renderSheet();saveLocal();
}
function pbRemaining(){
  return 27-ABILS.reduce((s,a)=>s+(PB_COST[state.baseScores[a]]||0),0);
}

function toggleSpell(name){
  const idx=state.spellsKnown.indexOf(name);
  if(idx>=0){
    state.spellsKnown.splice(idx,1);
    const pIdx=state.spellsPrepared.indexOf(name);
    if(pIdx>=0)state.spellsPrepared.splice(pIdx,1);
  }else{
    const sp=SPELLS_DB.find(x=>x.name===name);
    const stats=spellStats();
    if(!sp||!stats)return;
    if(sp.level===0){
      if(spellCount(0)>=stats.cantrips)return;
    }else{
      if(sp.level>stats.maxSlotLevel)return;
      if(stats.known!=null&&spellCountTotal()>=stats.known)return;
    }
    state.spellsKnown.push(name);
  }
  renderTab();renderSheet();saveLocal();
}
function subclassBonusSpells(){
  const sub=currentSubclass();
  if(!sub)return [];
  const lvl=curLevel();
  let table=sub.domainSpells;
  if(!table&&sub.domainSpellsByChoice){
    const picked=state.traitChoices[sub.domainSpellsByChoice.traitName];
    table=picked?sub.domainSpellsByChoice.options[picked]:null;
  }
  if(!table)return [];
  let names=[];
  Object.keys(table).forEach(L=>{if(Number(L)<=lvl)names=names.concat(table[L]);});
  return names.filter(n=>SPELLS_DB.some(s=>s.name===n));
}
function isPreparedCaster(){

}
function preparedCap(stats){
  const cls=CLASSES[state.classKey];
  const half=!!(cls.spellcasting&&cls.spellcasting.halfCaster);
  const effLevel=half?Math.floor(curLevel()/2):curLevel();
  return Math.max(1,mod(totalAbility(stats.ability))+effLevel);
}
function preparedCountNow(){

}
function togglePrepared(name){
  const idx=state.spellsPrepared.indexOf(name);
  if(idx>=0){
    state.spellsPrepared.splice(idx,1);
  }else{
    const sp=SPELLS_DB.find(x=>x.name===name);
    const stats=spellStats();
    if(!sp||!stats||sp.level===0)return;
    if(state.classKey==="magicien"&&!state.spellsKnown.includes(name))return;
    if(sp.level>stats.maxSlotLevel)return;
    if(preparedCountNow()>=preparedCap(stats))return;
    state.spellsPrepared.push(name);

function spellStats(){
  const cls=CLASSES[state.classKey];
  const sc=cls&&cls.spellcasting;
  if(!sc)return null;
  const lvl=curLevel();
  const levels=Object.keys(sc.table).map(Number).sort((a,b)=>a-b);
  const useLevel=levels.filter(l=>l<=lvl).pop()||levels[0];
  const entry=sc.table[useLevel];
  const scMod=mod(totalAbility(sc.ability));
  const slotLevels=Object.keys(entry.slots).map(Number);
  const maxSlotLevel=slotLevels.length?Math.max(...slotLevels):0;
  const hasCapacity=maxSlotLevel>0||entry.cantrips>0;
  return {ability:sc.ability,cantrips:entry.cantrips,slots:entry.slots,known:entry.known,maxSlotLevel,hasCapacity,pact:!!sc.pact,note:sc.note,dc:8+profBonus(lvl)+scMod,atk:profBonus(lvl)+scMod};
}
function classSpells(level){
  const base=SPELLS_DB.filter(s=>s.level===level&&s.classes.includes(state.classKey));
  if(state.classKey==="occultiste"){
    const sub=currentSubclass();
    const extraNames=(sub&&sub.expandedSpells&&sub.expandedSpells[level])||[];
    const extra=SPELLS_DB.filter(s=>s.level===level&&extraNames.includes(s.name)&&!base.includes(s));
    return base.concat(extra);
  }
  return base;
}
function spellCount(level){
  return state.spellsKnown.filter(n=>{const sp=SPELLS_DB.find(x=>x.name===n);return sp&&sp.level===level;}).length;
}
function spellCountTotal(){
  return state.spellsKnown.filter(n=>{const sp=SPELLS_DB.find(x=>x.name===n);return sp&&sp.level>0;}).length;
}
function spellRow(sp,mode){
  mode=mode||"known";
  const arr=mode==="prepare"?state.spellsPrepared:state.spellsKnown;
  const checked=arr.includes(sp.name);
  const stats=spellStats();
  let disabled=false;
  if(!checked){
    if(mode==="prepare"){
      disabled=sp.level>stats.maxSlotLevel||preparedCountNow()>=preparedCap(stats)||(state.classKey==="magicien"&&!state.spellsKnown.includes(sp.name));
    }else if(sp.level===0){
      disabled=spellCount(0)>=stats.cantrips;
    }else{
      disabled=sp.level>stats.maxSlotLevel||(stats.known!=null&&spellCountTotal()>=stats.known);
    }
  }
  const tag=sp.level>0?'<span class="spell-tag">'+spellRollTag(sp)+'</span>':'';
  const attr=mode==="prepare"?"data-prepare":"data-spell";
  return '<label class="spell-row'+(checked?" checked":"")+'">'+
   '<input type="checkbox" '+attr+'="'+esc(sp.name)+'" '+(checked?"checked":"")+' '+(disabled?"disabled":"")+'>'+
   '<span class="spell-row-head"><strong>'+sp.name+'</strong>'+tag+'<span class="spell-meta">'+sp.school+' · '+sp.time+' · '+sp.range+' · '+sp.duration+'</span></span>'+
   '<span class="spell-row-desc">'+resolveEffect(sp)+'</span>'+
  '</label>';
}
function resolveEffect(t){
  return typeof t.effect==="function"?t.effect():t.effect;
}
function traitList(cls){
  if(!cls.traits||!cls.traits.length)return "";
  return '<div class="trait-list">'+cls.traits.map(t=>{
    const raw=state.traitChoices[t.name];
    const chosen=(t.choice&&t.choice.type==="multiselect")?(raw||"").split(",").filter(Boolean).join(", "):raw;
    return '<div class="trait-card"><div class="trait-card-head"><strong>'+t.name+'</strong><span class="trait-usage">'+t.usage+'</span></div>'+
    (t.choice?('<div class="trait-choice-tag">Choix : '+(chosen?esc(chosen):'<em>non renseigné — voir l\'onglet Classe</em>')+'</div>'):'')+
    '<div class="trait-card-desc">'+resolveEffect(t)+'</div></div>';
  }).join("")+'</div>';
}
function traitEditor(cls){
  if(!cls.traits||!cls.traits.length)return "";
  return '<div class="trait-list">'+cls.traits.map(t=>{
    let choiceUi="";
    if(t.choice&&t.choice.type==="multiselect"){
      const opts=typeof t.choice.options==="function"?t.choice.options():t.choice.options;
      const chosen=(state.traitChoices[t.name]||"").split(",").filter(Boolean);
      const max=(typeof t.choice.max==="function"?t.choice.max():t.choice.max)||99;
      choiceUi='<p style="font-size:.72rem;color:var(--ink-soft);margin:8px 0 4px;">Choisissez jusqu\'à '+max+' ('+chosen.length+'/'+max+') :</p>'+
       '<div style="display:flex;flex-wrap:wrap;gap:6px;">'+
       opts.map(o=>{
         const checked=chosen.includes(o);
         const disabled=!checked&&chosen.length>=max;
         return '<label style="display:flex;align-items:center;gap:4px;background:var(--bg-alt);border:1px solid var(--line-soft);border-radius:6px;padding:4px 8px;font-size:.78rem;'+(disabled?"opacity:.5;":"")+'"><input type="checkbox" value="'+esc(o)+'" '+(checked?"checked":"")+' '+(disabled?"disabled":"")+' data-trait-multi="'+esc(t.name)+'" data-trait-multi-max="'+max+'">'+o+'</label>';
       }).join("")+
       '</div>';
    }else if(t.choice&&t.choice.type==="select"){
      choiceUi='<select data-trait="'+esc(t.name)+'" style="margin-top:8px;">'+
       '<option value="">— Choisissez —</option>'+
       t.choice.options.map(o=>'<option value="'+o+'"'+(state.traitChoices[t.name]===o?" selected":"")+'>'+o+'</option>').join("")+
       '</select>';
    }else if(t.choice){
      choiceUi='<input type="text" data-trait="'+esc(t.name)+'" placeholder="'+esc(t.choice.placeholder||"")+'" value="'+esc(state.traitChoices[t.name]||"")+'" style="margin-top:8px;">';
    }
    return '<div class="trait-card"><div class="trait-card-head"><strong>'+t.name+'</strong><span class="trait-usage">'+t.usage+'</span></div>'+
    '<div class="trait-card-desc">'+resolveEffect(t)+'</div>'+choiceUi+'</div>';

}
function grimoireModalHtml(){

  if(!s.hasCapacity)return '<p class="sheet-text">'+s.note+'</p>';
  const isMagicien=state.classKey==="magicien";
  const slotLevels=Object.keys(s.slots).map(Number).sort((a,b)=>a-b);

  let html='<p style="font-size:.86rem;margin:0 0 10px;">'+
   (isMagicien?('Grimoire : <strong>'+spellCountTotal()+' / '+s.known+'</strong> sorts connus (cochez pour les apprendre). '):'')+
   'Sorts préparés aujourd\'hui : <strong>'+preparedCountNow()+' / '+prepCap+'</strong>'+(isMagicien?' — à choisir parmi le grimoire':' — choisis parmi toute la liste de la classe')+' ; se change après un repos long.</p>';

        '<div class="spell-list">'+known.map(sp=>spellRow(sp,"prepare")).join("")+'</div>';

      html+='<h4 style="margin:14px 0 4px;font-family:\'Cinzel\',serif;font-size:.78rem;color:var(--gold-strong);">Niveau '+l+' — préparables</h4>'+
      '<div class="spell-list">'+list.map(sp=>spellRow(sp,"prepare")).join("")+'</div>';

  }else{
    bodySections=slotLevels.map(l=>{
      const list=classSpells(l);
      if(!list.length)return "";
      return '<h4 style="margin:14px 0 6px;font-family:\'Cinzel\',serif;font-size:.78rem;color:var(--gold-strong);">Sorts de niveau '+l+'</h4>'+
      '<div class="spell-list">'+list.map(sp=>spellRow(sp,"known")).join("")+'</div>';

  }
  return '<div class="detail-box" style="border-left-color:var(--arcane);margin-top:16px;"><h3>Incantation</h3>'+
  '<div class="pill-row">'+
    '<span class="pill">Caractéristique : '+ABIL_NAME[s.ability]+'</span>'+
    slotPills+
    '<span class="pill">DD de sauvegarde (sorts à jet de sauvegarde) : '+s.dc+'</span>'+
    '<span class="pill">Bonus d\'attaque (sorts à jet d\'attaque) : '+fmt(s.atk)+'</span>'+
  '</div>'+
  '<p style="font-size:.86rem;margin:10px 0 0;">'+s.note+' ('+knownText+')</p>'+
  cantripSection+

  '</div>';

function tabValidated(){
  if(state.levelUpMode){
    const cls=CLASSES[state.classKey];
    if(!state.levelUpBumped){
      const targetLevel=Math.min(MAX_LEVEL,state.level+1);
      return '<h2>Passage de niveau</h2>'+
      '<p class="panel-hint">'+esc(state.name||"Votre personnage")+' est actuellement niveau '+state.level+'.</p>'+
      (state.level<MAX_LEVEL?'<button class="btn btn-arcane" id="btn-do-levelup">Passer au niveau '+targetLevel+'</button>':'<p class="panel-hint">Cet outil s\'arrête pour l\'instant au niveau '+MAX_LEVEL+' — la suite de la progression n\'est pas encore codée.</p>')+
      '<div class="actions-row" style="margin-top:16px;"><button class="btn btn-ghost btn-sm" id="btn-cancel-levelup">Annuler</button></div>';
    }
    const lf=levelFeaturesForWizard(state.level);
    const featuresHtml=lf.features&&lf.features.length?traitEditor({traits:lf.features}):'<p class="sheet-text">Aucune aptitude de classe supplémentaire à ce niveau.</p>';
    const isReview=!!state.levelUpReview;
    return '<h2>'+(isReview?("Modifier le niveau "+state.level):("Niveau "+state.level+" — nouveautés"))+'</h2>'+
    '<p class="panel-hint">'+(isReview?("Revoyez ou ajustez les choix de ce niveau pour "+esc(state.name||"votre personnage")+". La classe, la race et l'historique ne peuvent plus être changés une fois qu'un niveau a été passé — utilisez « Nouveau personnage » pour repartir de zéro."):("Voici ce que "+esc(state.name||"votre personnage")+" gagne à ce niveau. Faites vos choix puis terminez."))+'</p>'+
    '<p style="font-family:\'Cinzel\',serif;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-strong);margin:16px 0 8px;">Aptitudes de ce niveau</p>'+
    featuresHtml+
    (lf.asi?asiPickerHtml():'')+
    (cls.spellcasting?spellBox():'')+
    '<div class="field" style="margin:16px 0;"><label for="f-sessionnotes">Notes pour la suite</label><textarea id="f-sessionnotes" style="min-height:120px;" placeholder="Objectifs en cours, indices, matériel à préparer pour la prochaine séance...">'+esc(state.sessionNotes)+'</textarea></div>'+
    '<button class="btn btn-arcane" id="btn-confirm-level">Valider ce niveau</button>';
  }
  const cls=CLASSES[state.classKey];const race=RACES[state.raceKey];
  return '<p class="panel-hint" style="margin:0 0 12px;">'+esc(state.name||"Votre personnage")+' — '+race.label+' '+cls.label+', niveau '+state.level+'. Fiche prête ci-contre.</p>'+
  (state.sessionNotes?('<div class="detail-box"><h3>Notes actuelles</h3><p class="sheet-text">'+esc(state.sessionNotes)+'</p></div>'):'')+
  '<div class="actions-row" style="margin-top:0;">'+
   '<button class="btn btn-arcane btn-sm" id="btn-levelup">Passer un niveau</button>'+
   '<button class="btn btn-ghost btn-sm" id="btn-unlock">'+(state.level===1?"Modifier le personnage":"Revoir ce niveau")+'</button>'+
   '<button class="btn btn-ghost btn-sm" id="btn-reset-validated">Nouveau personnage (supprimer)</button>'+
  '</div>';
}
function bindValidatedEvents(){
  const panel=document.getElementById("tabpanel");
  const notesEl=panel.querySelector("#f-sessionnotes");
  if(notesEl)notesEl.addEventListener("input",()=>{state.sessionNotes=notesEl.value;renderSheet();saveLocal();});
  const confirmBtn=panel.querySelector("#btn-confirm-level");
  if(confirmBtn)confirmBtn.addEventListener("click",()=>{
    state.levelUpMode=false;state.levelUpBumped=false;state.levelUpReview=false;renderTab();renderSheet();saveLocal();
  });
  const levelupBtn=panel.querySelector("#btn-levelup");
  if(levelupBtn)levelupBtn.addEventListener("click",()=>{
    state.levelUpMode=true;state.levelUpBumped=false;state.levelUpReview=false;renderTab();saveLocal();
  });
  const cancelLevelupBtn=panel.querySelector("#btn-cancel-levelup");
  if(cancelLevelupBtn)cancelLevelupBtn.addEventListener("click",()=>{
    state.levelUpMode=false;state.levelUpReview=false;renderTab();saveLocal();
  });
  const doLevelupBtn=panel.querySelector("#btn-do-levelup");
  if(doLevelupBtn)doLevelupBtn.addEventListener("click",()=>{
    state.level=Math.min(MAX_LEVEL,state.level+1);
    state.levelUpBumped=true;
    if(!state.grantedLevels.includes(state.level))state.grantedLevels.push(state.level);
    renderTab();renderSheet();saveLocal();
  });
  panel.querySelectorAll("[data-trait]").forEach(el=>el.addEventListener("change",()=>{
    state.traitChoices[el.dataset.trait]=el.value;renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-trait-multi]").forEach(el=>el.addEventListener("change",()=>{
    const name=el.dataset.traitMulti;
    let chosen=(state.traitChoices[name]||"").split(",").filter(Boolean);
    if(el.checked)chosen.push(el.value);else chosen=chosen.filter(v=>v!==el.value);
    state.traitChoices[name]=chosen.join(",");
    if(name==="Secrets magiques"){
      if(el.checked){if(!state.spellsKnown.includes(el.value))state.spellsKnown.push(el.value);}
      else{state.spellsKnown=state.spellsKnown.filter(v=>v!==el.value);}
    }
    renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-spell]").forEach(el=>el.addEventListener("change",()=>toggleSpell(el.dataset.spell)));
  panel.querySelectorAll("[data-prepare]").forEach(el=>el.addEventListener("change",()=>togglePrepared(el.dataset.prepare)));
  const openGrimoireBtn2=panel.querySelector("#btn-open-grimoire");
  if(openGrimoireBtn2)openGrimoireBtn2.addEventListener("click",()=>{if(window.openGrimoire)window.openGrimoire();});
  const asiModeOne=panel.querySelector('input[name="asi-mode"][value="one"]');
  const asiModeTwo=panel.querySelector('input[name="asi-mode"][value="two"]');
  const asiModeFeat=panel.querySelector('input[name="asi-mode"][value="feat"]');
  const asiOneUi=panel.querySelector("#asi-one-ui");
  const asiTwoUi=panel.querySelector("#asi-two-ui");
  const asiFeatUi=panel.querySelector("#asi-feat-ui");
  const asiFeatPick=panel.querySelector("#asi-pick-feat");
  const asiFeatDesc=panel.querySelector("#asi-feat-desc");
  const asiFeatAbilityUi=panel.querySelector("#asi-feat-ability-ui");
  const asiFeatAbility=panel.querySelector("#asi-feat-ability");
  const syncFeatDetail=()=>{
    if(!asiFeatPick)return;
    const f=FEATS[asiFeatPick.value];
    asiFeatDesc.textContent=f.effect;
    if(f.abilityChoice){
      asiFeatAbilityUi.style.display="flex";
      asiFeatAbility.innerHTML=f.abilityChoice.map(a=>'<option value="'+a+'">'+a+' (actuel '+totalAbility(a)+')</option>').join("");
    }else{
      asiFeatAbilityUi.style.display="none";
      asiFeatAbility.innerHTML="";
    }
  };
  if(asiModeOne&&asiModeTwo&&asiModeFeat){
    const sync=()=>{
      asiOneUi.style.display=asiModeOne.checked?"flex":"none";
      asiTwoUi.style.display=asiModeTwo.checked?"flex":"none";
      asiFeatUi.style.display=asiModeFeat.checked?"flex":"none";
    };
    asiModeOne.addEventListener("change",sync);
    asiModeTwo.addEventListener("change",sync);
    asiModeFeat.addEventListener("change",()=>{sync();syncFeatDetail();});
    if(asiFeatPick)asiFeatPick.addEventListener("change",syncFeatDetail);
    syncFeatDetail();
  }
  const applyAsiBtn=panel.querySelector("#btn-apply-asi");
  if(applyAsiBtn)applyAsiBtn.addEventListener("click",()=>{
    const mode=panel.querySelector('input[name="asi-mode"]:checked').value;
    let label="";
    if(mode==="one"){
      const a=panel.querySelector("#asi-pick-1").value;
      if(totalAbility(a)+2>20){showAlert("Cette caractéristique dépasserait 20 — choisissez-en une autre, ou répartissez +1/+1.");return;}
      state.asiBonuses[a]=(state.asiBonuses[a]||0)+2;
      label="+2 "+a;
    }else if(mode==="two"){
      const a=panel.querySelector("#asi-pick-2a").value;
      const b=panel.querySelector("#asi-pick-2b").value;
      if(a===b){showAlert("Choisissez deux caractéristiques différentes.");return;}
      if(totalAbility(a)+1>20||totalAbility(b)+1>20){showAlert("Une de ces caractéristiques dépasserait 20.");return;}
      state.asiBonuses[a]=(state.asiBonuses[a]||0)+1;
      state.asiBonuses[b]=(state.asiBonuses[b]||0)+1;
      label="+1 "+a+", +1 "+b;
    }else{
      const featKey=panel.querySelector("#asi-pick-feat").value;
      const f=FEATS[featKey];
      let ability=null;
      if(f.abilityChoice){
        ability=panel.querySelector("#asi-feat-ability").value;
        if(totalAbility(ability)+1>20){showAlert("Cette caractéristique dépasserait 20 — choisissez-en une autre pour ce don.");return;}
        state.asiBonuses[ability]=(state.asiBonuses[ability]||0)+1;
      }
      if(!state.featsChosen)state.featsChosen={};
      state.featsChosen[state.level]={feat:featKey,ability};
      label="Don : "+f.name+(ability?" ("+ability+")":"");
    }
    if(!state.asiApplied)state.asiApplied={};
    state.asiApplied[state.level]=label;
    renderTab();renderSheet();saveLocal();
  });
  const unlockBtn=panel.querySelector("#btn-unlock");
  if(unlockBtn)unlockBtn.addEventListener("click",()=>{
    if(state.level===1){
      state.inventory=[];state.inventoryInit=false;
      state.gold=0;state.hpCurrent=null;
      state.deathSuccess=0;state.deathFail=0;
      state.activeConditions=[];
      state.resourceUsed={};state.spellSlotsUsed={};
      state.hitDiceUsed=0;
      state.validated=false;state.levelUpMode=false;renderTabs();renderTab();renderSheet();saveLocal();
    }else{
      state.levelUpMode=true;state.levelUpBumped=true;state.levelUpReview=true;renderTab();saveLocal();
    }
  });
  const resetBtn=panel.querySelector("#btn-reset-validated");
  if(resetBtn)resetBtn.addEventListener("click",resetCharacter);
}

function renderTab(){
  const panel=document.getElementById("tabpanel");
  if(state.validated){panel.innerHTML=tabValidated();bindValidatedEvents();return;}
  if(state.activeTab==="race")panel.innerHTML=tabRace();
  else if(state.activeTab==="classe")panel.innerHTML=tabClasse();
  else if(state.activeTab==="historique")panel.innerHTML=tabHistorique();
  else if(state.activeTab==="carac")panel.innerHTML=tabCarac();

function lightWeaponNames(){
  return WEAPON_DATA.filter(w=>/légère/i.test(w.props)).map(w=>w.name);
}
function isTwoHanded(name){
  const w=WEAPON_DATA.find(x=>x.name===name);
  if(!w)return false;
  return /deux mains/i.test(w.props)&&!/Polyvalente/i.test(w.props);
}
function weaponOptions(list,selected){
  return '<option value=""'+(selected?"":" selected")+'>— Aucune —</option>'+
  WEAPON_DATA.filter(w=>list.includes(w.name)).map(w=>'<option value="'+w.name+'"'+(w.name===selected?" selected":"")+'>'+w.name+' — '+w.damage+'</option>').join("");
}
function ensureEquipmentChoice(){
  const cls=CLASSES[state.classKey];
  const def=cls.kitDefault||{armorKey:"aucune",shield:false,weapon1:"",weapon2:"",weaponRanged:""};
  const armorChoices=effectiveArmorChoices();
  const weaponChoices=effectiveWeaponChoices();
  if(!armorChoices.includes(state.armorKey))state.armorKey=def.armorKey;
  if(state.weapon1&&!weaponChoices.includes(state.weapon1))state.weapon1=def.weapon1||"";
  if(state.weapon1&&isTwoHanded(state.weapon1)){state.shield=false;state.weapon2="";}
  const offhand=weaponChoices.filter(n=>!isTwoHanded(n));
  if(state.weapon2&&!offhand.includes(state.weapon2))state.weapon2=(def.weapon2&&offhand.includes(def.weapon2))?def.weapon2:"";
  if(state.shield&&state.weapon2)state.weapon2="";
  const ranged=weaponChoices.filter(n=>{const w=WEAPON_DATA.find(x=>x.name===n);return w&&/Munitions/.test(w.props);});
  if(state.weaponRanged&&!ranged.includes(state.weaponRanged))state.weaponRanged=(def.weaponRanged&&ranged.includes(def.weaponRanged))?def.weaponRanged:"";
}
function optionRequirement(kc,value){
  if(kc.field==="armorKey"){
    const a=ARMOR_DATA.find(x=>x.key===value);
    return (a&&a.req)?a.req:null;
  }
  return null;
}
function reqMet(req){
  return !req||totalAbility(req.ability)>=req.score;
}
function weaponStatText(name){
  const w=WEAPON_DATA.find(x=>x.name===name);
  return w?(" — "+w.damage):"";
}
function bundleMatches(o,kc){
  return Object.keys(o.set).every(k=>state[k]===o.set[k]);
}
function kitChoiceLabel(kc){
  let base;
  if(kc.field==="armorKey")base=(ARMOR_DATA.find(a=>a.key===state.armorKey)||{}).label||"—";
  else if(kc.field==="weapon1")base=state.weapon1?(state.weapon1+weaponStatText(state.weapon1)):"—";
  else if(kc.field==="weapon2")base=state.weapon2?(state.weapon2+weaponStatText(state.weapon2)):"—";
  else if(kc.field==="bundle"){
    const match=kc.options.find(o=>bundleMatches(o,kc));
    base=match?match.label:"—";
  }
  else base="—";
  if(kc.suffix)base+=kc.suffix;
  const curValue=kc.field==="armorKey"?state.armorKey:(kc.field==="weapon1"?state.weapon1:null);
  const req=curValue?optionRequirement(kc,curValue):null;
  if(req&&!reqMet(req))base+=' — '+req.ability+' '+req.score+' requise (vous avez '+totalAbility(req.ability)+')';
  return base;
}
function kitChoiceLi(kc){
  const isWeaponField=kc.field==="weapon1"||kc.field==="weapon2";
  return '<li><details class="kit-line">'+
   '<summary>'+kitChoiceLabel(kc)+'<span class="kit-line-edit">cliquer pour changer</span></summary>'+
   '<div class="kit-line-options">'+kc.options.map(o=>{
     const req=optionRequirement(kc,o.value);
     const blocked=req&&!reqMet(req);
     const stat=isWeaponField?weaponStatText(o.value):"";
     return '<button type="button" class="kit-line-opt'+(blocked?" kit-line-opt-blocked":"")+'" '+(blocked?"disabled":"")+' data-kitchoice-key="'+kc.key+'" data-kitchoice-field="'+kc.field+'" data-kitchoice-value="'+esc(o.value)+'">'+o.label+stat+(blocked?' — '+req.ability+' '+req.score+' requise':'')+'</button>';
   }).join("")+'</div>'+
  '</details></li>';
}
function kitLineHtml(cls,text,index){
  const kc=(cls.kitChoices||[]).find(k=>k.kitIndex===index);
  if(!kc||(kc.visibleIf&&!kc.visibleIf()))return '<li>'+text+'</li>';
  return kitChoiceLi(kc);
}
function tabEquip(){
  const cls=CLASSES[state.classKey];
  const bg=BACKGROUNDS[state.bgKey];
  const extraChoices=(cls.kitChoices||[]).filter(k=>typeof k.kitIndex!=="number"&&(!k.visibleIf||k.visibleIf()));

   '<textarea id="f-equipnotes">'+esc(state.equipNotes)+'</textarea>'+

function bindTabEvents(){
  const panel=document.getElementById("tabpanel");
  panel.querySelectorAll("[data-race]").forEach(el=>el.addEventListener("click",()=>{
    state.raceKey=el.dataset.race;ensureRaceChoice();
    state.classSkillChoices=state.classSkillChoices.filter(s=>!raceFixedSkills().includes(s)&&!raceChosenSkills().includes(s));
    renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-race-choice]").forEach(el=>el.addEventListener("change",()=>{
    const idx=Number(el.dataset.raceChoice);
    state.raceChoiceAbilities[idx]=el.value;
    renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-race-skill]").forEach(el=>el.addEventListener("change",()=>{
    const idx=Number(el.dataset.raceSkill);
    state.raceSkillChoices[idx]=el.value;
    renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-class]").forEach(el=>el.addEventListener("click",()=>{
    state.classKey=el.dataset.class;state.classSkillChoices=[];state.spellsKnown=[];state.spellsPrepared=[];state.traitChoices={};
    const def=CLASSES[state.classKey].kitDefault;
    if(def){state.armorKey=def.armorKey;state.shield=def.shield;state.weapon1=def.weapon1;state.weapon2=def.weapon2;state.weaponRanged=def.weaponRanged;}
    ensureEquipmentChoice();renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-bg]").forEach(el=>el.addEventListener("click",()=>{
    state.bgKey=el.dataset.bg;renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-pb]").forEach(el=>el.addEventListener("click",()=>pbAdjust(el.dataset.pb,Number(el.dataset.dir))));
  panel.querySelectorAll("[data-skill]").forEach(el=>el.addEventListener("change",()=>{
    const name=el.dataset.skill;
    const cls=CLASSES[state.classKey];
    if(el.checked){
      if(state.classSkillChoices.length>=cls.skills.count){el.checked=false;return;}
      state.classSkillChoices.push(name);
    }else{
      state.classSkillChoices=state.classSkillChoices.filter(s=>s!==name);
    }
    renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-spell]").forEach(el=>el.addEventListener("change",()=>toggleSpell(el.dataset.spell)));
  panel.querySelectorAll("[data-prepare]").forEach(el=>el.addEventListener("change",()=>togglePrepared(el.dataset.prepare)));
  const openGrimoireBtn=panel.querySelector("#btn-open-grimoire");
  if(openGrimoireBtn)openGrimoireBtn.addEventListener("click",()=>{if(window.openGrimoire)window.openGrimoire();});
  panel.querySelectorAll("[data-trait]").forEach(el=>el.addEventListener("change",()=>{
    state.traitChoices[el.dataset.trait]=el.value;renderTab();renderSheet();saveLocal();
  }));
  panel.querySelectorAll("[data-trait-multi]").forEach(el=>el.addEventListener("change",()=>{
    const name=el.dataset.traitMulti;
    let chosen=(state.traitChoices[name]||"").split(",").filter(Boolean);
    if(el.checked)chosen.push(el.value);else chosen=chosen.filter(v=>v!==el.value);
    state.traitChoices[name]=chosen.join(",");
    if(name==="Secrets magiques"){
      if(el.checked){if(!state.spellsKnown.includes(el.value))state.spellsKnown.push(el.value);}
      else{state.spellsKnown=state.spellsKnown.filter(v=>v!==el.value);}
    }
    renderTab();renderSheet();saveLocal();
  }));
  const eq=panel.querySelector("#f-equipnotes");
  if(eq)eq.addEventListener("input",()=>{state.equipNotes=eq.value;renderSheet();saveLocal();});
  panel.querySelectorAll(".kit-line").forEach(d=>d.addEventListener("toggle",()=>{
    if(d.open)panel.querySelectorAll(".kit-line").forEach(o=>{if(o!==d)o.open=false;});
  }));
  panel.querySelectorAll("[data-kitchoice-field]").forEach(el=>el.addEventListener("click",()=>{
    const field=el.dataset.kitchoiceField;const value=el.dataset.kitchoiceValue;const key=el.dataset.kitchoiceKey;
    if(field==="bundle"){
      const kc=(CLASSES[state.classKey].kitChoices||[]).find(k=>k.key===key);
      const opt=kc&&kc.options.find(o=>o.value===value);
      if(opt)Object.assign(state,opt.set);
    }else{
      state[field]=value;
    }
    ensureEquipmentChoice();renderTab();renderSheet();saveLocal();
  }));
}

  const concentrationSpells=castable.map(n=>SPELLS_DB.find(x=>x.name===n)).filter(sp=>sp&&/concentration/i.test(sp.duration));

function unarmedStrikeInfo(){
  const strMod=mod(totalAbility("FOR"));
  const dexMod=mod(totalAbility("DEX"));
  const isMonk=state.classKey==="moine";
  const aMod=isMonk?Math.max(strMod,dexMod):strMod;
  const atk=profBonus(curLevel())+aMod;
  if(isMonk){
    const dieSize=curLevel()>=5?6:4;
    return {name:"Frappe à mains nues",props:"Contondant, FOR ou DEX",atk,dmgText:"1d"+dieSize+fmt(aMod)+" contondant"};
  }
  return {name:"Frappe à mains nues",props:"Contondant",atk,dmgText:(1+aMod)+" contondant"};
}
function equippedWeaponPairs(){
  const rows=[
    [weaponInfo(state.weapon1,false),""],
    [weaponInfo(state.weapon2,true),lightWeaponNames().includes(state.weapon2)?"":" — arme de secours, pas d'attaque bonus"],
    [weaponInfo(state.weaponRanged,false),""]
  ].filter(pair=>pair[0]);
  if(state.classKey==="moine")rows.push([unarmedStrikeInfo(),""]);
  else if(!rows.length)rows.push([unarmedStrikeInfo(),""]);
  return rows;
}

function pipGroupValue(group){
  if(group==="death-success")return state.deathSuccess;
  if(group==="death-fail")return state.deathFail;
  if(group==="hitdice")return state.hitDiceUsed;
  if(group.indexOf("spellslots:")===0)return state.spellSlotsUsed[group.slice(11)]||0;
  return resourceUsed(group);
}
function setPipGroupValue(group,val,max){
  val=Math.max(0,Math.min(val,max));
  if(group==="death-success")state.deathSuccess=val;
  else if(group==="death-fail")state.deathFail=val;
  else if(group==="hitdice")state.hitDiceUsed=val;
  else if(group.indexOf("spellslots:")===0)state.spellSlotsUsed[group.slice(11)]=val;
  else state.resourceUsed[group]=val;
}
function bindSheetPlayEvents(){
  const sheet=document.getElementById("sheet");
  sheet.querySelectorAll("[data-pip-group]").forEach(el=>el.addEventListener("click",()=>{
    const group=el.dataset.pipGroup;const idx=Number(el.dataset.pipIndex);const max=Number(el.dataset.pipMax);
    const cur=pipGroupValue(group);
    setPipGroupValue(group,idx<cur?idx:idx+1,max);
    renderSheet();saveLocal();
  }));
  const hpInput=sheet.querySelector("#f-hp-current");
  if(hpInput)hpInput.addEventListener("change",()=>{
    setHpCurrent(Number(hpInput.value));renderSheet();saveLocal();
  });
  sheet.querySelectorAll("[data-hp-dir]").forEach(el=>el.addEventListener("click",()=>{
    setHpCurrent(currentHp()+Number(el.dataset.hpDir));renderSheet();saveLocal();
  }));
  sheet.querySelectorAll("input.pool-input").forEach(el=>el.addEventListener("change",()=>{
    const name=el.dataset.poolName;const max=Number(el.dataset.poolMax);
    let remaining=Number(el.value);if(isNaN(remaining))remaining=max;
    remaining=Math.max(0,Math.min(remaining,max));
    state.resourceUsed[name]=max-remaining;
    renderSheet();saveLocal();
  }));
  sheet.querySelectorAll("button[data-pool-dir]").forEach(el=>el.addEventListener("click",()=>{
    const name=el.dataset.poolName;const max=Number(el.dataset.poolMax);const dir=Number(el.dataset.poolDir);
    const curRemaining=max-resourceUsed(name);
    const nextRemaining=Math.max(0,Math.min(curRemaining+dir,max));
    state.resourceUsed[name]=max-nextRemaining;
    renderSheet();saveLocal();
  }));
  const restShort=sheet.querySelector("#btn-rest-short");
  if(restShort)restShort.addEventListener("click",()=>{
    classResources().forEach(({t})=>{if(isShortRestResource(t))state.resourceUsed[t.name]=0;});
    if(state.classKey==="occultiste")state.spellSlotsUsed={};
    renderSheet();saveLocal();
  });
  const restLong=sheet.querySelector("#btn-rest-long");
  if(restLong)restLong.addEventListener("click",()=>{
    state.hpCurrent=maxHp();
    state.deathSuccess=0;state.deathFail=0;
    classResources().forEach(({t})=>{state.resourceUsed[t.name]=0;});
    state.spellSlotsUsed={};
    state.concentratingOn=null;
    const recover=Math.max(1,Math.floor(curLevel()/2));
    state.hitDiceUsed=Math.max(0,state.hitDiceUsed-recover);
    renderSheet();saveLocal();
  });
  const goldInput=sheet.querySelector("#f-gold");
  if(goldInput)goldInput.addEventListener("change",()=>{
    let v=Number(goldInput.value);if(isNaN(v)||v<0)v=0;
    state.gold=v;renderSheet();saveLocal();
  });
  sheet.querySelectorAll("[data-gold-dir]").forEach(el=>el.addEventListener("click",()=>{
    state.gold=Math.max(0,state.gold+Number(el.dataset.goldDir));
    renderSheet();saveLocal();
  }));
  bindInventoryEvents();
  sheet.querySelectorAll("[data-cond]").forEach(el=>el.addEventListener("click",()=>{
    const n=el.dataset.cond;
    const idx=state.activeConditions.indexOf(n);
    if(idx>=0)state.activeConditions.splice(idx,1);else state.activeConditions.push(n);
    renderSheet();saveLocal();
  }));
}
function renderSheet(){
  const derived=computeDerived();
  const race=RACES[state.raceKey];
  const cls=CLASSES[state.classKey];
  const bg=BACKGROUNDS[state.bgKey];
  const sc=spellStats();
  const effects=activeEffects();

  const effectsHtml=effects.length?('<details class="effects-details"><summary class="effects-summary" title="Effets actifs — cliquer pour dérouler">!</summary>'+
    '<div class="warn-box" style="margin-top:8px;"><ul style="margin:0;padding-left:18px;">'+effects.map(e=>'<li>'+e+'</li>').join("")+'</ul></div>'+
  '</details>'):'';
  const headHtml='<div class="sheet-head"><div class="who">'+
   '<h2 class="font-display">'+esc(state.name||"Sans nom")+'</h2>'+
   '<div class="subline">'+race.label+' · '+cls.label+' · '+bg.label+' · Niveau '+derived.level+'</div>'+
   effectsHtml+
  '</div>'+sealSvg(state.classKey)+'</div>';

  const bodyHtml=state.validated?sheetPlayBody(derived,race,cls,bg,sc):sheetCreationBody(derived,race,cls,bg,sc);

  document.getElementById("sheet").innerHTML=headHtml+bodyHtml+
  '<div class="actions-row"><button class="btn btn-arcane" id="btn-print">Imprimer la fiche</button></div>'+
  '<div class="storage-note">Personnage enregistré automatiquement dans ce navigateur.</div>';

  const printBtn=document.getElementById("btn-print");
  if(printBtn)printBtn.addEventListener("click",()=>window.print());
  const openGrimoireSheetBtn=document.getElementById("btn-open-grimoire-sheet");
  if(openGrimoireSheetBtn)openGrimoireSheetBtn.addEventListener("click",()=>{if(window.openGrimoire)window.openGrimoire();});
  const stopConcBtn=document.getElementById("btn-stop-concentration");
  if(stopConcBtn)stopConcBtn.addEventListener("click",()=>{state.concentratingOn=null;renderSheet();saveLocal();});
  const startConcBtn=document.getElementById("btn-start-concentration");
  if(startConcBtn)startConcBtn.addEventListener("click",()=>{
    const pick=document.getElementById("f-concentration-pick");
    if(pick&&pick.value){state.concentratingOn=pick.value;renderSheet();saveLocal();}
  });

  if(state.validated)bindSheetPlayEvents();
}

function bindHeader(){
  const nameEl=document.getElementById("f-name");
  nameEl.value=state.name;
  nameEl.addEventListener("input",()=>{state.name=nameEl.value;renderSheet();saveLocal();});
}

function resetCharacter(){
  showConfirm("Recommencer avec une fiche vierge ? Le personnage actuel sera perdu.",()=>{
    state=defaultState();
    state.name="";
    state.raceKey="humain";state.classKey="guerrier";state.bgKey="soldat";
    state.classSkillChoices=[];
    ABILS.forEach(a=>state.baseScores[a]=8);
    ensureRaceChoice();
    state.equipNotes="";state.spellsKnown=[];
    const def=CLASSES[state.classKey].kitDefault;
    state.armorKey=def?def.armorKey:"aucune";state.shield=def?def.shield:false;
    state.weapon1=def?def.weapon1:"";state.weapon2=def?def.weapon2:"";
    state.weaponRanged=def?def.weaponRanged:"";
    state.traitChoices={};
    boot(state);
    saveLocal();
  });
}
function bindReset(){
  document.getElementById("btn-reset").addEventListener("click",resetCharacter);
}

function bindValidate(){
  document.getElementById("btn-validate").addEventListener("click",()=>{
    state.validated=true;state.levelUpMode=false;seedInventory();renderTabs();renderTab();renderSheet();saveLocal();
  });
}

function boot(initial){
  state=Object.assign(defaultState(),initial||{});
  ensureRaceChoice();
  ensureEquipmentChoice();
  renderTabs();renderTab();renderSheet();
  bindHeader();bindReset();bindValidate();
}

  list.innerHTML=items.length?items.map(g=>'<div class="lex-entry"><div class="term">'+g.term+'</div><div class="def">'+g.def+'</div></div>').join(""):'<p class="sheet-text">Aucun résultat.</p>';
}
function initLexicon(){
  const btn=document.getElementById("btn-lexicon");
  const modal=document.getElementById("lexicon-modal");
  const backdrop=document.getElementById("lexicon-backdrop");
  const closeBtn=document.getElementById("lexicon-close");
  const search=document.getElementById("lexicon-search");
  const open=()=>{modal.hidden=false;search.value="";renderLexicon("");search.focus();};
  const close=()=>{modal.hidden=true;};
  btn.addEventListener("click",open);
  backdrop.addEventListener("click",close);
  closeBtn.addEventListener("click",close);
  search.addEventListener("input",()=>renderLexicon(search.value));
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)close();});
}

function renderGrimoire(){
  document.getElementById("grimoire-title").textContent=state.classKey==="magicien"?"Grimoire":"Sorts préparés";
  document.getElementById("grimoire-list").innerHTML=grimoireModalHtml();
  bindGrimoireEvents();
}
function bindGrimoireEvents(){
  const list=document.getElementById("grimoire-list");
  list.querySelectorAll("[data-spell]").forEach(el=>el.addEventListener("change",()=>{toggleSpell(el.dataset.spell);renderGrimoire();}));
  list.querySelectorAll("[data-prepare]").forEach(el=>el.addEventListener("change",()=>{togglePrepared(el.dataset.prepare);renderGrimoire();}));
}
function initGrimoire(){
  const modal=document.getElementById("grimoire-modal");
  const backdrop=document.getElementById("grimoire-backdrop");
  const closeBtn=document.getElementById("grimoire-close");
  const open=()=>{modal.hidden=false;renderGrimoire();};
  const close=()=>{modal.hidden=true;};
  backdrop.addEventListener("click",close);
  closeBtn.addEventListener("click",close);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)close();});
  window.openGrimoire=open;
}

let _confirmCallback=null;
function showConfirm(message,onConfirm){
  _confirmCallback=onConfirm;
  document.getElementById("confirm-message").textContent=message;
  document.getElementById("confirm-cancel").style.display="";
  document.getElementById("confirm-ok").textContent="Confirmer";
  document.getElementById("confirm-modal").hidden=false;
}
function showAlert(message){
  _confirmCallback=null;
  document.getElementById("confirm-message").textContent=message;
  document.getElementById("confirm-cancel").style.display="none";
  document.getElementById("confirm-ok").textContent="D'accord";
  document.getElementById("confirm-modal").hidden=false;
}
function initConfirmModal(){
  const modal=document.getElementById("confirm-modal");
  const backdrop=document.getElementById("confirm-backdrop");
  const okBtn=document.getElementById("confirm-ok");
  const cancelBtn=document.getElementById("confirm-cancel");
  const close=()=>{modal.hidden=true;_confirmCallback=null;};
  okBtn.addEventListener("click",()=>{
    const cb=_confirmCallback;
    close();
    if(cb)cb();
  });
  cancelBtn.addEventListener("click",close);
  backdrop.addEventListener("click",close);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)close();});
}

function getSnapshot(){return state;}
try{
  initLexicon();
  initGrimoire();
  initConfirmModal();
  if(window.claude&&window.claude.hot){
    window.claude.hot.snapshot(getSnapshot);
    const start=(data)=>{boot((data&&Object.keys(data).length)?data:loadLocal());};
    if(window.claude.hot.ready)window.claude.hot.ready(start);else start(window.claude.hot.data||{});
  }else{
    boot(loadLocal());
  }
}catch(e){boot(loadLocal());}
})();
</script>
